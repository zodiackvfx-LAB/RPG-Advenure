name: Build ZodiacOptimizer.exe

on:
  workflow_dispatch:
  push:
    branches:
      - claude/windows-pc-optimization-tool-3btmfp
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: EXE bauen
        run: >
          python -m PyInstaller
          --onefile
          --windowed
          --uac-admin
          --name ZodiacOptimizer
          --collect-all customtkinter
          main.py

      - name: EXE als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ZodiacOptimizer
          path: dist/ZodiacOptimizer.exe

      - name: Release mit EXE erstellen/aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Zodiac Optimizer v1.0.0
          body: |
            ⚡ **Zodiac Optimizer** – Windows-Tweaking-Tool

            **Download:** unten `ZodiacOptimizer.exe` herunterladen und starten
            (fordert automatisch Adminrechte an).

            Hinweis: Unsignierte EXE – Windows SmartScreen ggf. mit
            „Weitere Informationen → Trotzdem ausführen“ bestätigen.
          files: dist/ZodiacOptimizer.exe
